<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f5f6fa;">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 p-0">

            <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

        </div>

        <!-- Dashboard -->
        <div class="col-md-9 col-lg-10 p-4">

            <h2 class="mb-4 fw-bold">
                Admin Dashboard
            </h2>

            <div class="row">

                <!-- Students -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-primary text-white shadow">
                        <div class="card-body">
                            <h5>Total Students</h5>
                            <h2 th:text="${students}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Courses -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-success text-white shadow">
                        <div class="card-body">
                            <h5>Total Courses</h5>
                            <h2 th:text="${courses}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Enrollments -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-warning shadow">
                        <div class="card-body">
                            <h5>Total Enrollments</h5>
                            <h2 th:text="${enrollments}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Assignments -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-danger text-white shadow">
                        <div class="card-body">
                            <h5>Assignments</h5>
                            <h2 th:text="${assignments}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Quizzes -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-info text-white shadow">
                        <div class="card-body">
                            <h5>Quizzes</h5>
                            <h2 th:text="${quizzes}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Certificates -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-secondary text-white shadow">
                        <div class="card-body">
                            <h5>Certificates</h5>
                            <h2 th:text="${certificates}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Reviews -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-dark text-white shadow">
                        <div class="card-body">
                            <h5>Reviews</h5>
                            <h2 th:text="${reviews}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Live Classes -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-success text-white shadow">
                        <div class="card-body">
                            <h5>Live Classes</h5>
                            <h2 th:text="${liveClasses}"></h2>
                        </div>
                    </div>
                </div>

                <!-- Notifications -->
                <div class="col-md-3 mb-4">
                    <div class="card bg-warning shadow">
                        <div class="card-body">
                            <h5>Notifications</h5>
                            <h2 th:text="${notifications}"></h2>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
