<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>EduLearn LMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.hero{
background:#0d6efd;
color:white;
padding:100px 0;
}

.course-card{
transition:0.3s;
}

.course-card:hover{
transform:translateY(-5px);
}
</style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/">EduLearn LMS</a>

<button class="navbar-toggler" data-bs-toggle="collapse"
data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/login">Login</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/register">Register</a>
</li>

</ul>

</div>
</div>
</nav>

<section class="hero text-center">

<div class="container">

<h1>Learn New Skills Online</h1>

<p>Join thousands of students learning from expert instructors.</p>

<a href="/courses"
class="btn btn-light btn-lg">
Explore Courses
</a>

</div>

</section>

<div class="container mt-5">

<h2 class="mb-4">Featured Courses</h2>

<div class="row">

<div class="col-md-4 mb-4"
th:each="course : ${courses}">

<div class="card course-card shadow">

<div class="card-body">

<h5 th:text="${course.title}"></h5>

<p th:text="${course.description}"></p>

<a th:href="@{/course/{id}(id=${course.id})}"
class="btn btn-primary">

View Course

</a>

</div>
</div>

</div>

</div>

</div>

</body>
</html>
