<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Attendance Management</h2>

<a th:href="@{/admin/attendance/add}"
class="btn btn-primary mb-3">

Mark Attendance

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Student Email</th>
<th>Course ID</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="a : ${attendanceList}">

<td th:text="${a.studentEmail}"></td>

<td th:text="${a.courseId}"></td>

<td th:text="${a.date}"></td>

<td th:text="${a.status}"></td>

<td>

<a th:href="@{'/admin/attendance/edit/' + ${a.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/attendance/delete/' + ${a.id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Attendance?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
