<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Add Notification</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Add Notification</h2>

<form th:action="@{/admin/notifications/save}"
      th:object="${notification}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">

        <label class="form-label">
            Title
        </label>

        <input type="text"
               th:field="*{title}"
               class="form-control"
               required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Message
        </label>

        <textarea
                th:field="*{message}"
                rows="5"
                class="form-control"
                required>
        </textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Student Email
        </label>

        <input type="email"
               th:field="*{studentEmail}"
               class="form-control"
               placeholder="student@gmail.com">

    </div>

    <button class="btn btn-success">

        Save Notification

    </button>

    <a th:href="@{/admin/notifications}"
       class="btn btn-secondary">

        Back

    </a>

</form>

</div>

</body>
</html>
