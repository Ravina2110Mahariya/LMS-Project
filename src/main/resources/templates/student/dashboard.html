<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 mt-3">

            <h2>Student Dashboard</h2>

            <!-- Dashboard Stats -->

            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card bg-primary text-white shadow">
                        <div class="card-body">
                            <h5>Total Courses</h5>
                            <h3 th:text="${stats.totalCourses}">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-success text-white shadow">
                        <div class="card-body">
                            <h5>Assignments</h5>
                            <h3 th:text="${stats.totalAssignments}">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-warning text-dark shadow">
                        <div class="card-body">
                            <h5>Certificates</h5>
                            <h3 th:text="${stats.totalCertificates}">0</h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Quiz Stats -->

            <div class="row mt-4">

                <div class="col-md-6">
                    <div class="card shadow border-success">
                        <div class="card-body">
                            <h4>Total Quiz Score</h4>
                            <h2 class="text-success"
                                th:text="${totalQuizScore}">
                                0
                            </h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow border-primary">
                        <div class="card-body">
                            <h4>Quiz Percentage</h4>
                            <h2 class="text-primary"
                                th:text="${#numbers.formatDecimal(quizPercentage,1,2)} + '%'">
                                0%
                            </h2>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Welcome Card -->

            <div class="card mt-4 shadow">

                <div class="card-header bg-light">
                    Welcome
                </div>

                <div class="card-body">

                    <h5>Learning Management System</h5>

                    <p>
                        Welcome to Student Dashboard.
                        Here you can manage courses,
                        assignments, quizzes,
                        certificates and progress.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
