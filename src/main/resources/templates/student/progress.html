<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Progress</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <div class="col-md-9 mt-3">

            <h2>Course Progress</h2>

            <table class="table table-bordered mt-4">

                <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Completed Lessons</th>
                    <th>Total Lessons</th>
                    <th>Progress</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="p : ${progressList}">

					<td th:text="${p.courseId}"></td>
					
                    <td th:text="${p.completedLessons}"></td>

                    <td th:text="${p.totalLessons}"></td>

                    <td>

                        <div class="progress">

                            <div class="progress-bar bg-success"
                                 role="progressbar"
                                 th:style="'width:' + ${p.percentage} + '%'">

                                <span th:text="${p.percentage} + '%'"></span>

                            </div>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
