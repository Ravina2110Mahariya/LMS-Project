<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">

Report Management

</h2>

<a th:href="@{/admin/reports/add}"
class="btn btn-primary mb-3">

+ Generate Report

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Report Name</th>

<th>Report Type</th>

<th>Generated By</th>

<th>Generated At</th>

<th width="180">

Action

</th>

</tr>

</thead>

<tbody>

<tr th:each="r : ${reports}">

<td th:text="${r.reportName}"></td>

<td th:text="${r.reportType}"></td>

<td th:text="${r.generatedBy}"></td>

<td th:text="${r.generatedAt}"></td>

<td>

<a th:href="@{'/admin/reports/edit/' + ${r.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/reports/delete/' + ${r.id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Report?')">

Delete

</a>

</td>

</tr>

<tr th:if="${#lists.isEmpty(reports)}">

<td colspan="5"
class="text-center">

No Reports Available

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
