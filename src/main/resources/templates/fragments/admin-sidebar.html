<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="adminSidebar">

    <style>
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #ddd;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        .sidebar-header {
            background: #212529;
            color: white;
            padding: 18px;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }

        .sidebar .list-group-item {
            border: none;
            border-bottom: 1px solid #ececec;
            padding: 15px 20px;
            font-size: 18px;
            color: #222;
            transition: .3s;
        }

        .sidebar .list-group-item:hover {
            background: #0d6efd;
            color: white;
            padding-left: 28px;
        }

        .sidebar .list-group-item.active {
            background: #0d6efd;
            color: white;
        }

        .sidebar i {
            width: 28px;
        }

        .logout {
            color: red !important;
            font-weight: bold;
        }

        .logout:hover{
            background:red!important;
            color:white!important;
        }
    </style>

    <div class="sidebar">

        <div class="sidebar-header">
            Admin Panel
        </div>

        <div class="list-group list-group-flush">

            <a th:href="@{/admin/dashboard}" class="list-group-item">
                📊 Dashboard
            </a>

            <a th:href="@{/admin/courses}" class="list-group-item">
                📚 Courses
            </a>

            <a th:href="@{/admin/course-content}" class="list-group-item">
                📖 Course Content
            </a>

            <a th:href="@{/admin/videos}" class="list-group-item">
                🎥 Videos
            </a>

            <a th:href="@{/admin/assignments}" class="list-group-item">
                📝 Assignments
            </a>

            <a th:href="@{/admin/quizzes}" class="list-group-item">
                ❓ Quizzes
            </a>

            <a th:href="@{/admin/attendance}" class="list-group-item">
                🗓 Attendance
            </a>

            <a th:href="@{/admin/live-classes}" class="list-group-item">
                🎦 Live Classes
            </a>

            <a th:href="@{/admin/notifications}" class="list-group-item">
                🔔 Notifications
            </a>

            <a th:href="@{/admin/reviews}" class="list-group-item">
                ⭐ Reviews
            </a>

            <a th:href="@{/admin/discussions}" class="list-group-item">
                💬 Discussions
            </a>

            <a th:href="@{/admin/reports}" class="list-group-item">
                📈 Reports
            </a>

            <a th:href="@{/admin/users}" class="list-group-item">
                👤 Users
            </a>

            <a th:href="@{/admin/certificates}" class="list-group-item">
                🏆 Certificates
            </a>

            <a th:href="@{/admin/enrollments}" class="list-group-item">
                🎓 Enrollments
            </a>

            <a th:href="@{/admin/notes}" class="list-group-item">
                📄 Notes
            </a>

            <a th:href="@{/admin/progress}" class="list-group-item">
                📉 Progress
            </a>

            <a th:href="@{/logout}" class="list-group-item logout">
                🚪 Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
