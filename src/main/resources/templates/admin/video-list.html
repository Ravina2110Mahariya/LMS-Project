<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Video Lectures</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3"
     th:replace="fragments/admin-sidebar :: adminSidebar">
</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-primary text-white d-flex justify-content-between">

<h4>Video Lectures</h4>

<a th:href="@{/admin/videos/add}"
   class="btn btn-light btn-sm">

+ Add Video

</a>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Title</th>

<th>Course ID</th>

<th>Video Name</th>

<th>Uploaded By</th>

<th>Video</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="video : ${videos}">

<td th:text="${video.title}"></td>

<td th:text="${video.courseId}"></td>

<td th:text="${video.videoName}"></td>

<td th:text="${video.uploadedBy}"></td>

<td>

<a th:href="${video.videoPath}" target="_blank">
View Video
</a>

</td>

<td>

<a th:href="@{/admin/videos/edit/{id}(id=${video.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{/admin/videos/delete/{id}(id=${video.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this video?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
