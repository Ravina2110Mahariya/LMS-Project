<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Video Lectures</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3">

<div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>

</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Video Lectures</h3>

</div>

<div class="card-body">

<div class="alert alert-warning"
     th:if="${#lists.isEmpty(videos)}">

No Videos Available

</div>

<table class="table table-bordered"
       th:if="${!#lists.isEmpty(videos)}">

<thead>

<tr>

<th>Title</th>

<th>Course</th>

<th>Video</th>

<th>Uploaded By</th>

</tr>

</thead>

<tbody>

<tr th:each="video : ${videos}">

<td th:text="${video.title}"></td>

<td th:text="${video.courseId}"></td>

<td>

<a th:href="@{${video.videoPath}}"
   target="_blank"
   class="btn btn-success btn-sm">

Watch

</a>

</td>

<td th:text="${video.uploadedBy}"></td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
