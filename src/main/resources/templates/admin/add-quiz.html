<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container">

<div class="card shadow mt-5">

<div class="card-header bg-success text-white">

<h3>Add Quiz</h3>

</div>

<div class="card-body">

<form th:action="@{/admin/quizzes/save}"
      th:object="${quiz}"
      method="post">

<input type="hidden" th:field="*{id}">

<div class="mb-3">

<label>Course ID</label>

<input type="text"
       th:field="*{courseId}"
       class="form-control">

</div>

<div class="mb-3">

<label>Quiz Title</label>

<input type="text"
       th:field="*{title}"
       class="form-control"
       required>

</div>

<div class="mb-3">

<label>Question</label>

<textarea
        th:field="*{question}"
        class="form-control"
        rows="3"></textarea>

</div>

<div class="mb-3">

<label>Option A</label>

<input type="text"
       th:field="*{optionA}"
       class="form-control">

</div>

<div class="mb-3">

<label>Option B</label>

<input type="text"
       th:field="*{optionB}"
       class="form-control">

</div>

<div class="mb-3">

<label>Option C</label>

<input type="text"
       th:field="*{optionC}"
       class="form-control">

</div>

<div class="mb-3">

<label>Option D</label>

<input type="text"
       th:field="*{optionD}"
       class="form-control">

</div>

<div class="mb-3">

<label>Correct Answer</label>

<input type="text"
       th:field="*{correctAnswer}"
       class="form-control">

</div>

<button class="btn btn-success">

Save Quiz

</button>

<a th:href="@{/admin/quizzes}"
   class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
