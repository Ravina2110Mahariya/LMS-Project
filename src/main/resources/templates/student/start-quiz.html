<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Start Quiz</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>
<body>

<div class="container-fluid">


<div class="row">

    <!-- Sidebar -->
    <div class="col-md-3 mt-3">
        <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9 mt-3">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h3 th:text="${quiz.title}">Quiz Title</h3>
            </div>

            <div class="card-body">

                <h5 class="mb-4" th:text="${quiz.question}">
                    Question
                </h5>

                <form th:action="@{/student/submit-quiz}" method="post">

				    <input type="hidden"
				           name="quizId"
				           th:value="${quiz.id}">

                    <div class="form-check mb-2">
                        <input class="form-check-input"
                               type="radio"
                               name="answer"
                               value="A">

                        <label class="form-check-label"
                               th:text="${quiz.optionA}">
                            Option A
                        </label>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input"
                               type="radio"
                               name="answer"
                               value="B">

                        <label class="form-check-label"
                               th:text="${quiz.optionB}">
                            Option B
                        </label>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input"
                               type="radio"
                               name="answer"
                               value="C">

                        <label class="form-check-label"
                               th:text="${quiz.optionC}">
                            Option C
                        </label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input"
                               type="radio"
                               name="answer"
                               value="D">

                        <label class="form-check-label"
                               th:text="${quiz.optionD}">
                            Option D
                        </label>
                    </div>

                    <button type="submit"
                            class="btn btn-success">
                        Submit Quiz
                    </button>

                    <a th:href="@{/student/quizzes}"
                       class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>


</div>

</body>
</html>
