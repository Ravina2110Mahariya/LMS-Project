<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quiz Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>
        </div>

        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white d-flex justify-content-between">

                    <h3>Quiz Management</h3>

                    <a th:href="@{/admin/quizzes/add}"
                       class="btn btn-light">

                        Add Quiz

                    </a>

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>Title</th>
                            <th>Course ID</th>
                            <th>Question</th>
                            <th>Correct Answer</th>
                            <th width="200">Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="quiz : ${quizzes}">

                            <td th:text="${quiz.title}"></td>

                            <td th:text="${quiz.courseId}"></td>

                            <td th:text="${quiz.question}"></td>

                            <td th:text="${quiz.correctAnswer}"></td>

                            <td>

                                <a th:href="@{/admin/quizzes/edit/{id}(id=${quiz.id})}"
                                   class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a th:href="@{/admin/quizzes/delete/{id}(id=${quiz.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this Quiz?')">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
