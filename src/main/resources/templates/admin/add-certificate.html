<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Add Certificate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->
<div class="col-md-3 col-lg-2 bg-light min-vh-100 p-0">
    <div th:replace="fragments/admin-sidebar :: adminSidebar"></div>
</div>

<!-- Content -->
<div class="col-md-9 col-lg-10 p-4">

<h2 class="mb-4">Certificate Form</h2>

<form th:action="@{/admin/certificates/save}"
      th:object="${certificate}"
      method="post">

<input type="hidden" th:field="*{id}">

<div class="mb-3">

<label class="form-label">

Student Email

</label>

<input type="email"
class="form-control"
th:field="*{studentEmail}"
required>

</div>

<div class="mb-3">

<label class="form-label">

User ID

</label>

<input type="text"
class="form-control"
th:field="*{userId}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Course ID

</label>

<input type="text"
class="form-control"
th:field="*{courseId}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Certificate Number

</label>

<input type="text"
class="form-control"
th:field="*{certificateNumber}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Issue Date

</label>

<input type="text"
class="form-control"
th:field="*{issueDate}"
placeholder="2026-07-30"
required>

</div>

<button class="btn btn-success">

Save Certificate

</button>

<a th:href="@{/admin/certificates}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>
</html>
