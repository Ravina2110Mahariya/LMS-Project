<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Discussion List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Discussion Management</h2>

<a th:href="@{/admin/discussions/add}"
class="btn btn-primary mb-3">

+ Add Discussion

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Course ID</th>

<th>Student Email</th>

<th>Question</th>

<th>Reply</th>

<th>Replied By</th>

<th>Created At</th>

<th width="170">Action</th>

</tr>

</thead>

<tbody>

<tr th:each="d : ${discussions}">

<td th:text="${d.courseId}"></td>

<td th:text="${d.studentEmail}"></td>

<td th:text="${d.question}"></td>

<td th:text="${d.reply}"></td>

<td th:text="${d.repliedBy}"></td>

<td th:text="${d.createdAt}"></td>

<td>

<a th:href="@{'/admin/discussions/edit/' + ${d.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/discussions/delete/' + ${d.id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Discussion?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
