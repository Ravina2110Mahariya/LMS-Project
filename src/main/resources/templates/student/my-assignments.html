<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Assignments</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <div class="col-md-9 mt-3">

            <h2>My Assignments</h2>

            <table class="table table-bordered table-striped mt-4">

                <thead class="table-primary">
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="assignment : ${assignments}">

                    <td th:text="${assignment.title}"></td>

                    <td th:text="${assignment.description}"></td>

                    <td th:text="${assignment.dueDate}"></td>

                    <td>
						<a th:href="@{/student/submit-assignment/{id}(id=${assignment.id})}"
						   class="btn btn-success">
						    Submit Assignment
						</a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
