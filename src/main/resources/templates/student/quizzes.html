<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quizzes</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>
<body>

<div class="container-fluid">


<div class="row">

    <!-- Sidebar -->
    <div class="col-md-3 mt-3">
        <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
    </div>

    <!-- Content -->
    <div class="col-md-9 mt-3">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3>Available Quizzes</h3>
            </div>

            <div class="card-body">

                <!-- No Quiz -->
                <div th:if="${#lists.isEmpty(quizzes)}"
                     class="alert alert-warning">
                    No Quiz Available
                </div>

                <!-- Quiz List -->
                <table class="table table-bordered"
                       th:if="${!#lists.isEmpty(quizzes)}">

                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Question</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="quiz : ${quizzes}">

                        <td th:text="${quiz.title}">Title</td>

                        <td th:text="${quiz.question}">Question</td>

                        <td>
                            <a th:href="@{/student/start-quiz/{id}(id=${quiz.id})}"
                               class="btn btn-success btn-sm">
                                Start Quiz
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


</div>

</body>
</html>
