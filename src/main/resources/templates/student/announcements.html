<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Announcements</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3">

<div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>

</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Announcements</h3>

</div>

<div class="card-body">

<div class="alert alert-warning"
th:if="${#lists.isEmpty(announcements)}">

No Announcements Available

</div>

<div class="card mb-3"
th:each="a : ${announcements}">

<div class="card-body">

<h5 th:text="${a.title}"></h5>

<p th:text="${a.message}"></p>

<hr>

<small>

Created By :

<span th:text="${a.createdBy}"></span>

<br>

<span th:text="${a.createdAt}"></span>

</small>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
