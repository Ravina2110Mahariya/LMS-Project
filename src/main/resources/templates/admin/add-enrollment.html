<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Enrollment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Enrollment Form</h2>

<form th:action="@{/admin/enrollments/save}"
th:object="${enrollment}"
method="post">

<input type="hidden"
th:field="*{id}">

<div class="mb-3">

<label>User ID</label>

<input type="text"
class="form-control"
th:field="*{userId}"
required>

</div>

<div class="mb-3">

<label>Student Email</label>

<input type="email"
class="form-control"
th:field="*{studentEmail}"
required>

</div>

<div class="mb-3">

<label>Course ID</label>

<input type="text"
class="form-control"
th:field="*{courseId}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-select"
th:field="*{status}">

<option value="ENROLLED">
ENROLLED
</option>

<option value="COMPLETED">
COMPLETED
</option>

<option value="PENDING">
PENDING
</option>

<option value="CANCELLED">
CANCELLED
</option>

</select>

</div>

<button class="btn btn-success">

Save

</button>

<a th:href="@{/admin/enrollments}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>
</html>
