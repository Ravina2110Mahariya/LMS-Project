<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3">
<div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
</div>

<div class="col-md-9 mt-3">

<h2>My Profile</h2>

<div class="card mt-3">

<div class="card-body">

<form>

<div class="mb-3">

<label>Name</label>

<input type="text"
       class="form-control"
       th:value="${user.name}"
       readonly>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
       class="form-control"
       th:value="${user.email}"
       readonly>

</div>

<div class="mb-3">

<label>Role</label>

<input type="text"
       class="form-control"
       th:value="${user.role}"
       readonly>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
