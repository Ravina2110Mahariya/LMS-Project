<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Certificates</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <h2 class="mb-4">My Certificates</h2>

    <div class="card">

        <div class="card-header bg-success text-white">
            Earned Certificates
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead>
                <tr>
                    <th>Certificate No</th>
                    <th>Course ID</th>
                    <th>Issue Date</th>
                    <th>Download</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="cert : ${certificates}">

                    <td th:text="${cert.certificateNumber}"></td>

                    <td th:text="${cert.courseId}"></td>

                    <td th:text="${cert.issueDate}"></td>

                    <td>
                        <a class="btn btn-primary btn-sm"
                           th:href="@{/certificate/download(courseId=${cert.courseId})}">
                            Download PDF
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
