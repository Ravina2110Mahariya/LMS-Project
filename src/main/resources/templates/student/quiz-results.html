<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quiz Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h3>My Quiz Results</h3>
                </div>

                <div class="card-body">

                    <table class="table table-bordered">

                        <thead>
                        <tr>
                            <th>Quiz ID</th>
                            <th>Selected Answer</th>
                            <th>Correct</th>
                            <th>Score</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="r : ${results}">

                            <td th:text="${r.quizId}"></td>

                            <td th:text="${r.selectedAnswer}"></td>

                            <td>
                                <span th:if="${r.correct}"
                                      class="badge bg-success">
                                    Correct
                                </span>

                                <span th:unless="${r.correct}"
                                      class="badge bg-danger">
                                    Wrong
                                </span>
                            </td>

                            <td th:text="${r.score}"></td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
