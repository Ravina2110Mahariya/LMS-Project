<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Upload Notes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">

Upload Notes

</h2>

<form th:action="@{/admin/notes/save}"

method="post"

enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

Title

</label>

<input type="text"

name="title"

class="form-control"

required>

</div>

<div class="mb-3">

<label class="form-label">

Course ID

</label>

<input type="text"

name="courseId"

class="form-control"

required>

</div>

<div class="mb-3">

<label class="form-label">

Uploaded By

</label>

<input type="text"

name="uploadedBy"

class="form-control"

value="ADMIN"

readonly>

</div>

<div class="mb-3">

<label class="form-label">

Select File

</label>

<input type="file"

name="file"

class="form-control"

required>

</div>

<button class="btn btn-success">

Upload

</button>

<a th:href="@{/admin/notes}"

class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>

</html>
