<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assignments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>
        </div>

        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white d-flex justify-content-between">

                    <h3>Assignment Management</h3>

                    <a th:href="@{/admin/assignments/add}"
                       class="btn btn-light">
                        Add Assignment
                    </a>

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>Title</th>

                            <th>Course ID</th>

                            <th>Due Date</th>

                            <th>File</th>

                            <th width="180">Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="a : ${assignments}">

                            <td th:text="${a.title}"></td>

                            <td th:text="${a.courseId}"></td>

                            <td th:text="${a.dueDate}"></td>

                            <td th:text="${a.fileName}"></td>

                            <td>

                                <a th:href="@{/admin/assignments/delete/{id}(id=${a.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete Assignment?')">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
