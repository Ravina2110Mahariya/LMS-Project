<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Notes Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Notes Management</h2>

<a th:href="@{/admin/notes/add}"
class="btn btn-primary mb-3">

+ Upload Notes

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Title</th>

<th>Course ID</th>

<th>File Name</th>

<th>Uploaded By</th>

<th>Download</th>

</tr>

</thead>

<tbody>

<tr th:each="n : ${notes}">

<td th:text="${n.title}"></td>

<td th:text="${n.courseId}"></td>

<td th:text="${n.fileName}"></td>

<td th:text="${n.uploadedBy}"></td>

<td>

<a th:href="@{'/uploads/notes/' + ${n.fileName}}"
target="_blank"
class="btn btn-success btn-sm">

Download

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
