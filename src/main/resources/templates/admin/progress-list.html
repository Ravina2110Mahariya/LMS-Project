<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Progress</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Progress Management</h2>

<a th:href="@{/admin/progress/add}"
class="btn btn-primary mb-3">

+ Add Progress

</a>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>Email</th>

<th>Course</th>

<th>Completed</th>

<th>Total</th>

<th>%</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="p : ${progressList}">

<td th:text="${p.studentEmail}"></td>

<td th:text="${p.courseName}"></td>

<td th:text="${p.completedLessons}"></td>

<td th:text="${p.totalLessons}"></td>

<td th:text="${p.percentage}"></td>

<td>

<a th:href="@{'/admin/progress/edit/' + ${p.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/progress/delete/' + ${p.id}}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
