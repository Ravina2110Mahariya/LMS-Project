<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>My Attendance</h3>
                </div>

                <div class="card-body">

                    <!-- No Attendance -->
                    <div th:if="${#lists.isEmpty(attendance)}"
                         class="alert alert-warning">
                        No Attendance Records Found.
                    </div>

                    <!-- Attendance Table -->
                    <table class="table table-bordered table-striped"
                           th:if="${!#lists.isEmpty(attendance)}">

                        <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Course ID</th>
                            <th>Status</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="a : ${attendance}">

                            <td th:text="${a.date}"></td>

                            <td th:text="${a.courseId}"></td>

                            <td>
                                <span th:if="${a.status == 'Present'}"
                                      class="badge bg-success">
                                    Present
                                </span>

                                <span th:if="${a.status == 'Absent'}"
                                      class="badge bg-danger">
                                    Absent
                                </span>

                                <span th:if="${a.status != 'Present' and a.status != 'Absent'}"
                                      class="badge bg-secondary"
                                      th:text="${a.status}">
                                </span>
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
