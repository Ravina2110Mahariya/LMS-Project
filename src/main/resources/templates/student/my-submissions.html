<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Submissions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>

<div class="container-fluid">

<div class="row">

    <div class="col-md-3 mt-3">
        <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
    </div>

    <div class="col-md-9 mt-3">

        <h2>My Assignment Submissions</h2>

        <table class="table table-bordered table-striped mt-4">

            <thead class="table-dark">
            <tr>
                <th>Assignment ID</th>
                <th>Answer</th>
                <th>Status</th>
                <th>Marks</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="sub : ${submissions}">

                <td th:text="${sub.assignmentId}"></td>

                <td th:text="${sub.answer}"></td>

                <td>
                    <span class="badge bg-warning"
                          th:if="${sub.status=='PENDING'}">
                        Pending
                    </span>

                    <span class="badge bg-success"
                          th:if="${sub.status=='CHECKED'}">
                        Checked
                    </span>
                </td>

                <td th:text="${sub.marks}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


</div>

</body>
</html>
