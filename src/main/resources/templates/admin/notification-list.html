<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Notifications</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Notification Management</h2>

    <a th:href="@{/admin/notifications/add}"
       class="btn btn-primary mb-3">
        Add Notification
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>Title</th>
            <th>Message</th>
            <th>Student Email</th>
            <th>Created By</th>
            <th>Created At</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="n : ${notifications}">

            <td th:text="${n.title}"></td>

            <td th:text="${n.message}"></td>

            <td th:text="${n.studentEmail}"></td>

            <td th:text="${n.createdBy}"></td>

            <td th:text="${n.createdAt}"></td>

            <td>

                <a th:href="@{'/admin/notifications/edit/' + ${n.id}}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{'/admin/notifications/delete/' + ${n.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete Notification?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
