<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Discussions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container-fluid">

<div class="row">

    <!-- Sidebar -->
    <div class="col-md-3 mt-3">
        <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9 mt-3">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3>Course Discussions</h3>
            </div>

            <div class="card-body">

                <!-- No Discussion -->
                <div class="alert alert-warning"
                     th:if="${#lists.isEmpty(discussions)}">

                    No Discussion Available.

                </div>

                <!-- Discussion List -->
                <div th:if="${!#lists.isEmpty(discussions)}">

                    <div class="card mb-3"
                         th:each="d : ${discussions}">

                        <div class="card-body">

                            <h5 class="text-primary">
                                <span th:text="${d.studentEmail}">
                                    Student
                                </span>
                            </h5>

                            <p>
                                <strong>Course ID :</strong>
                                <span th:text="${d.courseId}"></span>
                            </p>

                            <p>
                                <strong>Question :</strong><br>
                                <span th:text="${d.question}"></span>
                            </p>

                            <p>
                                <strong>Reply :</strong><br>

                                <span class="text-success"
                                      th:if="${d.reply!=null}"
                                      th:text="${d.reply}">
                                </span>

                                <span class="text-danger"
                                      th:if="${d.reply==null}">
                                    No reply yet
                                </span>

                            </p>

                            <p class="text-muted">

                                <strong>Replied By :</strong>

                                <span th:text="${d.repliedBy!=null ? d.repliedBy : '-'}"></span>

                            </p>

                            <small class="text-secondary"
                                   th:text="${d.createdAt}">
                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
