<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Video</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3"
     th:replace="fragments/admin-sidebar :: adminSidebar">
</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>Add / Edit Video</h4>

</div>

<div class="card-body">

<form th:action="@{/admin/videos/save}"
      th:object="${video}"
      method="post">

<input type="hidden"
       th:field="*{id}">

<div class="mb-3">

<label>Title</label>

<input type="text"
       class="form-control"
       th:field="*{title}"
       required>

</div>

<div class="mb-3">

<label>Course ID</label>

<input type="text"
       class="form-control"
       th:field="*{courseId}"
       required>

</div>

<div class="mb-3">

<label>Video Name</label>

<input type="text"
       class="form-control"
       th:field="*{videoName}"
       required>

</div>

<div class="mb-3">

<label>Video Path / URL</label>

<input type="text"
       class="form-control"
       th:field="*{videoPath}"
       placeholder="https://... or /uploads/video.mp4"
       required>

</div>

<div class="mb-3">

<label>Uploaded By</label>

<input type="text"
       class="form-control"
       th:field="*{uploadedBy}"
       required>

</div>

<button class="btn btn-success">

Save

</button>

<a th:href="@{/admin/videos}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
