<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Add Progress</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Progress Form</h2>

<form th:action="@{/admin/progress/save}"
th:object="${progress}"
method="post">

<input type="hidden"
th:field="*{id}">

<input class="form-control mb-2"
th:field="*{studentEmail}"
placeholder="Student Email">

<input class="form-control mb-2"
th:field="*{courseId}"
placeholder="Course ID">

<input class="form-control mb-2"
th:field="*{courseName}"
placeholder="Course Name">

<input class="form-control mb-2"
type="number"
th:field="*{completedLessons}"
placeholder="Completed Lessons">

<input class="form-control mb-2"
type="number"
th:field="*{totalLessons}"
placeholder="Total Lessons">

<input class="form-control mb-2"
type="number"
step="0.1"
th:field="*{percentage}"
placeholder="Percentage">

<button class="btn btn-success">

Save

</button>

<a th:href="@{/admin/progress}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>
</html>
