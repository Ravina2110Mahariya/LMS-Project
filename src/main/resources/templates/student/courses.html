<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>My Courses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/student-courses.css}">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            EduLearn LMS
        </a>

        <div>

            <a href="/student/dashboard"
               class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/logout"
               class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Page Header -->

<div class="container mt-4">

    <div class="row mb-4">

        <div class="col-md-6">

            <h2>My Courses</h2>

        </div>

        <div class="col-md-6">

            <form class="d-flex">

                <input type="text"
                       class="form-control me-2"
                       placeholder="Search Course">

                <button class="btn btn-primary">
                    Search
                </button>

            </form>

        </div>

    </div>

    <!-- Courses -->

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="course : ${courses}">

            <div class="card course-card shadow">

                <img th:src="${course.imageUrl}"
                     src="https://via.placeholder.com/400x200"
                     class="card-img-top course-img">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${course.title}">
                        Java Programming
                    </h5>

                    <p class="text-muted"
                       th:text="${course.instructorName}">
                        Instructor
                    </p>

                    <p th:text="${course.description}">
                        Course Description
                    </p>

                    <!-- Progress -->

                    <label class="fw-bold">
                        Progress
                    </label>

                    <div class="progress mb-3">

                        <div class="progress-bar bg-success"
                             role="progressbar"
                             th:style="'width:' + ${course.progress} + '%'">

                            <span th:text="${course.progress} + '%'">
                                80%
                            </span>

                        </div>

                    </div>

                    <a th:href="@{/student/course/{id}(id=${course.id})}"
                       class="btn btn-primary w-100">

                        Continue Learning

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
