<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Course Reviews</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Student Reviews</h3>
                </div>

                <div class="card-body">

                    <!-- No Reviews -->
                    <div th:if="${#lists.isEmpty(reviews)}"
                         class="alert alert-warning">
                        No Reviews Available.
                    </div>

                    <!-- Reviews -->
                    <div th:if="${!#lists.isEmpty(reviews)}">

                        <div class="card mb-3"
                             th:each="review : ${reviews}">

                            <div class="card-body">

                                <h5 class="card-title"
                                    th:text="${review.studentEmail}">
                                    Student Email
                                </h5>

                                <p>
                                    <strong>Course ID :</strong>
                                    <span th:text="${review.courseId}"></span>
                                </p>

                                <p>
                                    <strong>Rating :</strong>
                                    <span class="badge bg-success"
                                          th:text="${review.rating + ' / 5'}">
                                    </span>
                                </p>

                                <p>
                                    <strong>Comment :</strong><br>
                                    <span th:text="${review.comment}"></span>
                                </p>

                                <p class="text-muted">
                                    <strong>Date :</strong>
                                    <span th:text="${review.createdAt}"></span>
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
