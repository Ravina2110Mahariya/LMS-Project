<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Enrollment Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Enrollment Management</h2>

<a th:href="@{/admin/enrollments/add}"
class="btn btn-primary mb-3">

+ Add Enrollment

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>User ID</th>

<th>Student Email</th>

<th>Course ID</th>

<th>Status</th>

<th width="180">Action</th>

</tr>

</thead>

<tbody>

<tr th:each="e : ${enrollments}">

<td th:text="${e.userId}"></td>

<td th:text="${e.studentEmail}"></td>

<td th:text="${e.courseId}"></td>

<td>

<span class="badge bg-success"
th:text="${e.status}"></span>

</td>

<td>

<a th:href="@{'/admin/enrollments/edit/' + ${e.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/enrollments/delete/' + ${e.id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Enrollment?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
