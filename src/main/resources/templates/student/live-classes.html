<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Live Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Live Classes</h3>
                </div>

                <div class="card-body">

                    <div th:if="${#lists.isEmpty(classes)}"
                         class="alert alert-warning">
                        No Live Classes Available.
                    </div>

                    <div class="row"
                         th:if="${!#lists.isEmpty(classes)}">

                        <div class="col-md-6 mb-4"
                             th:each="cls : ${classes}">

                            <div class="card border-primary">

                                <div class="card-body">

                                    <h5 th:text="${cls.title}"></h5>

                                    <p th:text="${cls.description}"></p>

                                    <p>
                                        <strong>Instructor :</strong>
                                        <span th:text="${cls.instructorName}"></span>
                                    </p>

                                    <p>
                                        <strong>Date :</strong>
                                        <span th:text="${cls.classDate}"></span>
                                    </p>

                                    <p>
                                        <strong>Time :</strong>
                                        <span th:text="${cls.startTime}"></span>
                                    </p>

                                    <a th:href="${cls.meetingLink}"
                                       target="_blank"
                                       class="btn btn-success">
                                        Join Live Class
                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
