<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Live Classes</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3">

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-primary text-white d-flex justify-content-between">

<h3>Live Class Management</h3>

<a th:href="@{/admin/liveclasses/add}"
class="btn btn-light">

Add Live Class

</a>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Title</th>

<th>Course ID</th>

<th>Date</th>

<th>Time</th>

<th>Instructor</th>

<th>Meeting Link</th>

<th width="220">Action</th>

</tr>

</thead>

<tbody>

<tr th:each="live : ${liveClasses}">

<td th:text="${live.title}"></td>

<td th:text="${live.courseId}"></td>

<td th:text="${live.classDate}"></td>

<td th:text="${live.startTime}"></td>

<td th:text="${live.instructorName}"></td>

<td>

<a th:href="${live.meetingLink}"
target="_blank">

Join

</a>

</td>

<td>

<a
th:href="@{/admin/liveclasses/edit/{id}(id=${live.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a
th:href="@{/admin/liveclasses/delete/{id}(id=${live.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this Live Class?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
