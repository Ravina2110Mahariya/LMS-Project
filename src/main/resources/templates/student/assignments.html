<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assignments</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container-fluid">


<div class="row">

    <div class="col-md-3 mt-3">
        <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
    </div>

    <div class="col-md-9 mt-3">

        <div class="d-flex justify-content-between align-items-center">
            <h2>All Assignments</h2>
			
            <a th:href="@{/student/quizzes}"
               class="btn btn-success">
                Assessments
            </a>
        </div>

        <table class="table table-bordered table-striped mt-4">

            <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Due Date</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="assignment : ${assignments}">

                <td th:text="${assignment.title}"></td>

                <td th:text="${assignment.description}"></td>

                <td th:text="${assignment.dueDate}"></td>

                <td>
                    <a class="btn btn-primary btn-sm"
                       th:href="@{/student/submit-assignment/{id}(id=${assignment.id})}">
                        Submit Assignment
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


</div>

</body>
</html>

</body>
</html>
