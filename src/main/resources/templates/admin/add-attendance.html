<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Mark Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">Mark Attendance</h2>

<form th:action="@{/admin/attendance/save}"
      th:object="${attendance}"
      method="post">

<input type="hidden" th:field="*{id}">

<div class="mb-3">

<label>Student Email</label>

<input type="email"
class="form-control"
th:field="*{studentEmail}"
required>

</div>

<div class="mb-3">

<label>Course ID</label>

<input type="text"
class="form-control"
th:field="*{courseId}"
required>

</div>

<div class="mb-3">

<label>Date</label>

<input type="date"
class="form-control"
th:field="*{date}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-select"
th:field="*{status}">

<option value="Present">Present</option>

<option value="Absent">Absent</option>

</select>

</div>

<button class="btn btn-success">

Save Attendance

</button>

<a th:href="@{/admin/attendance}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>
</html>
