<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Reviews</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Student Reviews</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>Course ID</th>

            <th>Student Email</th>

            <th>Rating</th>

            <th>Comment</th>

            <th>Created At</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="review : ${reviews}">

            <td th:text="${review.courseId}"></td>

            <td th:text="${review.studentEmail}"></td>

            <td>

                <span class="badge bg-success"
                      th:text="${review.rating + ' / 5'}">
                </span>

            </td>

            <td th:text="${review.comment}"></td>

            <td th:text="${review.createdAt}"></td>

            <td>

                <a th:href="@{'/admin/reviews/delete/' + ${review.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this review?')">

                    Delete

                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(reviews)}">

            <td colspan="6" class="text-center text-muted">

                No Reviews Available

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
