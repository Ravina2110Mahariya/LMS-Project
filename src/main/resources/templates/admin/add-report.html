<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">

Generate Report

</h2>

<form th:action="@{/admin/reports/save}"

th:object="${report}"

method="post">

<input type="hidden"

th:field="*{id}">

<div class="mb-3">

<label class="form-label">

Report Name

</label>

<input type="text"

class="form-control"

th:field="*{reportName}"

required>

</div>

<div class="mb-3">

<label class="form-label">

Report Type

</label>

<select class="form-select"

th:field="*{reportType}">

<option value="Student Report">

Student Report

</option>

<option value="Course Report">

Course Report

</option>

<option value="Attendance Report">

Attendance Report

</option>

<option value="Assignment Report">

Assignment Report

</option>

<option value="Quiz Report">

Quiz Report

</option>

<option value="Certificate Report">

Certificate Report

</option>

<option value="Review Report">

Review Report

</option>

<option value="Enrollment Report">

Enrollment Report

</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Generated By

</label>

<input type="text"

class="form-control"

th:field="*{generatedBy}"

value="ADMIN"

readonly>

</div>

<button class="btn btn-success">

Save

</button>

<a th:href="@{/admin/reports}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>

</html>
