<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Assignment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container">

<div class="card shadow mt-5">

<div class="card-header bg-success text-white">

<h3>Add Assignment</h3>

</div>

<div class="card-body">

<form th:action="@{/admin/assignments/save}"
      th:object="${assignment}"
      method="post">

<div class="mb-3">

<label>Title</label>

<input type="text"
       th:field="*{title}"
       class="form-control"
       required>

</div>

<div class="mb-3">

<label>Course ID</label>

<input type="text"
       th:field="*{courseId}"
       class="form-control">

</div>

<div class="mb-3">

<label>Description</label>

<textarea
        th:field="*{description}"
        class="form-control"></textarea>

</div>

<div class="mb-3">

<label>Due Date</label>

<input type="date"
       th:field="*{dueDate}"
       class="form-control">

</div>

<div class="mb-3">

<label>File Name</label>

<input type="text"
       th:field="*{fileName}"
       class="form-control">

</div>

<div class="mb-3">

<label>File URL</label>

<input type="text"
       th:field="*{fileUrl}"
       class="form-control">

</div>

<button class="btn btn-success">

Save Assignment

</button>

<a th:href="@{/admin/assignments}"
   class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
