<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Course Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9 mt-3">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Course Management</h3>
                </div>

                <div class="card-body">

                    <!-- Add Course Form -->
                    <form th:action="@{/admin/course/save}" method="post">

                        <input type="hidden" name="id"/>

                        <div class="mb-3">
                            <label class="form-label">Course Title</label>
                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description"
                                      class="form-control"
                                      rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Instructor</label>
                            <input type="text"
                                   name="instructor"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text"
                                   name="category"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number"
                                   step="0.01"
                                   name="price"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="text"
                                   name="imageUrl"
                                   class="form-control">
                        </div>

                        <button type="submit" class="btn btn-success">
                            Save Course
                        </button>

                    </form>

                    <hr>

                    <!-- Course List -->

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                        <tr>
                            <th>Title</th>
                            <th>Instructor</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="5" class="text-center">
                                No Courses Available
                            </td>
                        </tr>

                        <tr th:each="course : ${courses}">

                            <td th:text="${course.title}"></td>

                            <td th:text="${course.instructor}"></td>

                            <td th:text="${course.category}"></td>

                            <td th:text="${course.price}"></td>

                            <td>

                                <a th:href="@{/admin/course/delete/{id}(id=${course.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this course?')">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
