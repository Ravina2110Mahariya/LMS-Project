<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Live Class</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container">

<div class="card shadow mt-5">

<div class="card-header bg-success text-white">

<h3>Add Live Class</h3>

</div>

<div class="card-body">

<form
th:action="@{/admin/liveclasses/save}"
th:object="${liveClass}"
method="post">

<input
type="hidden"
th:field="*{id}">

<div class="mb-3">

<label>Course ID</label>

<input
type="text"
th:field="*{courseId}"
class="form-control">

</div>

<div class="mb-3">

<label>Title</label>

<input
type="text"
th:field="*{title}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
th:field="*{description}"
class="form-control"
rows="3"></textarea>

</div>

<div class="mb-3">

<label>Meeting Link</label>

<input
type="text"
th:field="*{meetingLink}"
class="form-control">

</div>

<div class="mb-3">

<label>Class Date</label>

<input
type="date"
th:field="*{classDate}"
class="form-control">

</div>

<div class="mb-3">

<label>Start Time</label>

<input
type="time"
th:field="*{startTime}"
class="form-control">

</div>

<div class="mb-3">

<label>Instructor Name</label>

<input
type="text"
th:field="*{instructorName}"
class="form-control">

</div>

<button
class="btn btn-success">

Save Live Class

</button>

<a
th:href="@{/admin/liveclasses}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
