<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Course Content</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Student Sidebar -->
        <div class="col-md-3 mt-3">
            <div th:replace="~{fragments/student-sidebar :: studentSidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 mt-3">

            <h2 class="mb-4">Course Content</h2>

            <!-- No Content -->
            <div th:if="${#lists.isEmpty(contents)}"
                 class="alert alert-warning">
                No content available for this course.
            </div>

            <!-- Content List -->
            <div th:each="content : ${contents}"
                 class="card shadow mb-3">

                <div class="card-body">

                    <h4 th:text="${content.title}"></h4>

                    <p class="mb-3">
                        <strong>Type :</strong>
                        <span th:text="${content.type}"></span>
                    </p>

                    <!-- VIDEO -->
                    <a th:if="${content.type == 'VIDEO'}"
                       th:href="@{${content.fileUrl}}"
                       target="_blank"
                       class="btn btn-danger">

                        🎥 Watch Video

                    </a>

                    <!-- PDF -->
                    <a th:if="${content.type == 'PDF'}"
                       th:href="@{${content.fileUrl}}"
                       target="_blank"
                       class="btn btn-primary">

                        📄 Open PDF

                    </a>

                    <!-- Other Files -->
                    <a th:if="${content.type != 'VIDEO' and content.type != 'PDF'}"
                       th:href="@{${content.fileUrl}}"
                       target="_blank"
                       class="btn btn-success">

                        📂 Open File

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
