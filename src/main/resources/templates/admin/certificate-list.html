<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Certificates</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->
<div class="col-md-3 col-lg-2 bg-light min-vh-100 p-0">
    <div th:replace="fragments/admin-sidebar :: adminSidebar"></div>
</div>

<!-- Content -->
<div class="col-md-9 col-lg-10 p-4">

<div class="d-flex justify-content-between mb-3">

<h2>Certificates</h2>

<a th:href="@{/admin/certificates/add}"
class="btn btn-primary">

+ Add Certificate

</a>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>#</th>
<th>Student Email</th>
<th>Course ID</th>
<th>Certificate No.</th>
<th>Issue Date</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="certificate,stat : ${certificates}">

<td th:text="${stat.count}"></td>

<td th:text="${certificate.studentEmail}"></td>

<td th:text="${certificate.courseId}"></td>

<td th:text="${certificate.certificateNumber}"></td>

<td th:text="${certificate.issueDate}"></td>

<td>

<a th:href="@{'/admin/certificates/edit/' + ${certificate.id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{'/admin/certificates/delete/' + ${certificate.id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this certificate?')">

Delete

</a>

</td>

</tr>

<tr th:if="${#lists.isEmpty(certificates)}">

<td colspan="6" class="text-center">

No Certificates Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
