<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Course Content</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

<div class="row">

<div class="col-md-3 mt-3"
th:replace="fragments/admin-sidebar :: adminSidebar">
</div>

<div class="col-md-9 mt-3">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>Add / Edit Course Content</h4>

</div>

<div class="card-body">

<form th:action="@{/admin/course-content/save}"
th:object="${content}"
method="post">

<input type="hidden"
th:field="*{id}">

<div class="mb-3">

<label>Course ID</label>

<input type="text"
class="form-control"
th:field="*{courseId}"
required>

</div>

<div class="mb-3">

<label>Title</label>

<input type="text"
class="form-control"
th:field="*{title}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea class="form-control"
rows="3"
th:field="*{description}"></textarea>

</div>

<div class="mb-3">

<label>Video URL</label>

<input type="text"
class="form-control"
th:field="*{videoUrl}">

</div>

<div class="mb-3">

<label>Google Drive URL</label>

<input type="text"
class="form-control"
th:field="*{driveUrl}">

</div>

<div class="mb-3">

<label>File URL</label>

<input type="text"
class="form-control"
th:field="*{fileUrl}">

</div>

<div class="mb-3">

<label>File Name</label>

<input type="text"
class="form-control"
th:field="*{fileName}">

</div>

<div class="mb-3">

<label>Type</label>

<select class="form-select"
th:field="*{type}">

<option value="VIDEO">VIDEO</option>

<option value="PDF">PDF</option>

<option value="DOC">DOC</option>

<option value="LINK">LINK</option>

</select>

</div>

<button class="btn btn-success">

Save

</button>

<a th:href="@{/admin/course-content}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
